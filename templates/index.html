<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Performance Predictor</title>
</head>

<body style="
    margin: 0;
    font-family: Arial, sans-serif;
    background-color: #f2f2f2;
">

    <div style="
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
        box-sizing: border-box;
    ">

        <div style="
            width: 700px;
            background: #F8F8F8;
            border-radius: 16px;
            padding: 50px;
            text-align: center;
            box-shadow: 0 8px 30px rgba(0,0,0,0.08);
        ">

            <h1 style="
                font-size: 48px;
                color: #192125;
                margin-bottom: 20px;
            ">
                Student Exam Performance Indicator
            </h1>

            <p style="
                font-size: 20px;
                color: #555;
                line-height: 1.6;
                margin-bottom: 40px;
            ">
                Predict a student's mathematics score based on gender,
                ethnicity, parental education, lunch type and test preparation.
            </p>

            <a href="/predictdata" style="
                text-decoration: none;
                background: #192125;
                color: white;
                padding: 15px 35px;
                border-radius: 8px;
                font-size: 18px;
                display: inline-block;
            ">
                Start Prediction
            </a>

        </div>

    </div>
