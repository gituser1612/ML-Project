<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prediction</title>
</head>

<body style="
    margin: 0;
    font-family: Arial, sans-serif;
    background-color: #ffffff;
">

    <div style="
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
    ">

        <div style="
            width: 750px;
            background: #F8F8F8;
            border: 1px solid #e5e5e5;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        ">

            <h1 style="
                text-align: center;
                margin-top: 0;
                margin-bottom: 10px;
                font-size: 36px;
            ">
                Student Exam Performance Indicator
            </h1>

            <h2 style="
                text-align: center;
                margin-bottom: 30px;
                font-size: 24px;
                font-weight: 500;
            ">
                Predict Maths Score
            </h2>

            <form action="{{ url_for('predict_datapoint') }}" method="post">

                <div style="
                    display: grid;
                    grid-template-columns: 240px 1fr;
                    gap: 16px 20px;
                    align-items: center;
                ">

                    <label>Gender</label>

                    <select name="gender" required style="
                        padding: 10px;
                        border: 1px solid #d0d0d0;
                        border-radius: 6px;
                        width: 100%;
                        box-sizing: border-box;
                    ">
                        <option value="">Select your gender</option>
                        <option value="male">Male</option>
                        <option value="female">Female</option>
                    </select>

                    <label>Race or Ethnicity</label>

                    <select name="ethnicity" required style="
                        padding: 10px;
                        border: 1px solid #d0d0d0;
                        border-radius: 6px;
                        width: 100%;
                    ">
                        <option value="">Select your ethnicity</option>
                        <option value="group A">Group A</option>
                        <option value="group B">Group B</option>
                        <option value="group C">Group C</option>
                        <option value="group D">Group D</option>
                        <option value="group E">Group E</option>
                    </select>

                    <label>Parental Level of Education</label>

                    <select name="parental_level_of_education" required style="
                        padding: 10px;
                        border: 1px solid #d0d0d0;
                        border-radius: 6px;
                        width: 100%;
                    ">
                        <option value="">Select parent education</option>
                        <option value="associate's degree">Associate's degree</option>
                        <option value="bachelor's degree">Bachelor's degree</option>
                        <option value="high school">High school</option>
                        <option value="master's degree">Master's degree</option>
                        <option value="some college">Some college</option>
                        <option value="some high school">Some high school</option>
                    </select>

                    <label>Lunch Type</label>

                    <select name="lunch" required style="
                        padding: 10px;
                        border: 1px solid #d0d0d0;
                        border-radius: 6px;
                        width: 100%;
                    ">
                        <option value="">Select lunch type</option>
                        <option value="free/reduced">Free / Reduced</option>
                        <option value="standard">Standard</option>
                    </select>

                    <label>Test Preparation Course</label>

                    <select name="test_preparation_course" required style="
                        padding: 10px;
                        border: 1px solid #d0d0d0;
                        border-radius: 6px;
                        width: 100%;
                    ">
                        <option value="">Select test course</option>
                        <option value="none">None</option>
                        <option value="completed">Completed</option>
                    </select>

                    <label>Writing Score (0-100)</label>

                    <input type="number"
                        name="writing_score"
                        min="0"
                        max="100"
                        placeholder="Enter writing score"
                        required
                        style="
                            padding: 10px;
                            border: 1px solid #d0d0d0;
                            border-radius: 6px;
                            width: 100%;
                            box-sizing: border-box;
                        ">

                    <label>Reading Score (0-100)</label>

                    <input type="number"
                        name="reading_score"
                        min="0"
                        max="100"
                        placeholder="Enter reading score"
                        required
                        style="
                            padding: 10px;
                            border: 1px solid #d0d0d0;
                            border-radius: 6px;
                            width: 100%;
                            box-sizing: border-box;
                        ">

                </div>

                <div style="
                    text-align: center;
                    margin-top: 30px;
                ">

                    <button type="submit" style="
                        background: #192125;
                        color: white;
                        border: none;
                        padding: 12px 28px;
                        border-radius: 8px;
                        cursor: pointer;
                        font-size: 15px;
                    ">
                        Predict Maths Score
                    </button>

                </div>

            </form>

            <h2 style="
                text-align: center;
                margin-top: 25px;
            ">
                {{ results }}
            </h2>

        </div>
    </div>

</body>

</html>
