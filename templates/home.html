<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prediction</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #ffffff;
        }

        .container {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card {
            width: 750px;
            max-width: 100%;
            background: #F8F8F8;
            border: 1px solid #e5e5e5;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }

        h1 {
            text-align: center;
            font-size: 36px;
            margin-bottom: 10px;
            color: #192125;
        }

        .subtitle {
            text-align: center;
            font-size: 24px;
            margin-bottom: 30px;
            font-weight: 500;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 220px 1fr;
            gap: 16px 20px;
            align-items: center;
        }

        label {
            font-size: 16px;
            color: #333;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #d0d0d0;
            border-radius: 6px;
            background-color: white;
            font-size: 15px;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #192125;
        }

        .button-container {
            margin-top: 30px;
            text-align: center;
        }

        button {
            background: #192125;
            color: white;
            border: none;
            padding: 14px 30px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
            transition: 0.3s;
        }

        button:hover {
            opacity: 0.9;
        }

        .result {
            text-align: center;
            margin-top: 25px;
            font-size: 24px;
            font-weight: bold;
            color: #192125;
        }

        /* Mobile Responsive */

        @media (max-width: 768px) {

            .card {
                padding: 20px;
            }

            h1 {
                font-size: 28px;
            }

            .subtitle {
                font-size: 20px;
                margin-bottom: 20px;
            }

            .form-grid {
                grid-template-columns: 1fr;
                gap: 10px;
            }

            label {
                font-weight: 600;
                margin-top: 8px;
            }

            button {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="card">

            <h1>Student Exam Performance Indicator</h1>

            <h2 class="subtitle">Predict Maths Score</h2>

            <form action="{{ url_for('predict_datapoint') }}" method="post">

                <div class="form-grid">

                    <label>Gender</label>

                    <select name="gender" required>
                        <option value="">Select your gender</option>
                        <option value="male">Male</option>
                        <option value="female">Female</option>
                    </select>

                    <label>Race or Ethnicity</label>

                    <select name="ethnicity" required>
                        <option value="">Select your ethnicity</option>
                        <option value="group A">Group A</option>
                        <option value="group B">Group B</option>
                        <option value="group C">Group C</option>
                        <option value="group D">Group D</option>
                        <option value="group E">Group E</option>
                    </select>

                    <label>Parental Level of Education</label>

                    <select name="parental_level_of_education" required>
                        <option value="">Select parent education</option>
                        <option value="associate's degree">Associate's degree</option>
                        <option value="bachelor's degree">Bachelor's degree</option>
                        <option value="high school">High school</option>
                        <option value="master's degree">Master's degree</option>
                        <option value="some college">Some college</option>
                        <option value="some high school">Some high school</option>
                    </select>

                    <label>Lunch Type</label>

                    <select name="lunch" required>
                        <option value="">Select lunch type</option>
                        <option value="free/reduced">Free / Reduced</option>
                        <option value="standard">Standard</option>
                    </select>

                    <label>Test Preparation Course</label>

                    <select name="test_preparation_course" required>
                        <option value="">Select test course</option>
                        <option value="none">None</option>
                        <option value="completed">Completed</option>
                    </select>

                    <label>Writing Score (0–100)</label>

                    <input type="number"
                           name="writing_score"
                           placeholder="Enter writing score"
                           min="0"
                           max="100"
                           required>

                    <label>Reading Score (0–100)</label>

                    <input type="number"
                           name="reading_score"
                           placeholder="Enter reading score"
                           min="0"
                           max="100"
                           required>

                </div>

                <div class="button-container">

                    <button type="submit">
                        Predict Maths Score
                    </button>

                </div>

            </form>

            {% if results %}

            <div class="result">
                Predicted Score: {{ results }}
            </div>

            {% endif %}

        </div>

    </div>

</body>

</html>
